<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CryptoPulse Analytics</title>
    <link rel="stylesheet" href="css/tailwind.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .redirect-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        
        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .redirect-text {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff 0%, #00ff88 100%);
            color: #fff;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }
    </style>
<script type="module" src="https://static.rocket.new/rocket-web.js?_cfg=https%3A%2F%2Fcryptopuls9795back.builtwithrocket.new&_be=https%3A%2F%2Fapplication.rocket.new&_v=0.1.8"></script>
</head>
<body>
    <div class="redirect-container">
        <div class="logo">CryptoPulse Analytics</div>
        <div class="subtitle">Real-time Cryptocurrency Intelligence</div>
        <div class="loading-spinner" id="loadingSpinner"></div>
        <div class="redirect-text" id="redirectText">Checking authentication status...</div>
        
        <div class="action-buttons" id="actionButtons" style="display: none;">
            <a href="pages/login.html" class="btn btn-primary">Login</a>
            <a href="pages/multi_coin_overview_dashboard.html" class="btn btn-secondary">View Demo</a>
        </div>
    </div>

    <script>
        // Check authentication status
        function checkAuthStatus() {
            const session = localStorage.getItem('cryptopulse_session');
            const redirectText = document.getElementById('redirectText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const actionButtons = document.getElementById('actionButtons');

            if (session) {
                try {
                    const sessionData = JSON.parse(session);
                    const now = Date.now();
                    const loginTime = sessionData.loginTime;
                    
                    // Check if session is still valid (24 hours)
                    if (now - loginTime < 24 * 60 * 60 * 1000) {
                        redirectText.textContent = `Welcome back, ${sessionData.user}! Redirecting to dashboard...`;
                        setTimeout(() => {
                            window.location.href = 'pages/multi_coin_overview_dashboard.html';
                        }, 2000);
                        return;
                    } else {
                        // Session expired
                        localStorage.removeItem('cryptopulse_session');
                    }
                } catch (e) {
                    // Invalid session data
                    localStorage.removeItem('cryptopulse_session');
                }
            }

            // No valid session found
            setTimeout(() => {
                loadingSpinner.style.display = 'none';
                redirectText.textContent = 'Choose your access method:';
                actionButtons.style.display = 'flex';
            }, 1500);
        }

        // Initialize on page load
        window.addEventListener('load', checkAuthStatus);

        // Add click handlers for demo access
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('btn-secondary')) {
                e.preventDefault();
                
                // Set demo session for direct access
                localStorage.setItem('cryptopulse_session', JSON.stringify({
                    user: 'demo@cryptopulse.com',
                    loginTime: Date.now(),
                    demo: true
                }));
                
                window.location.href = 'pages/multi_coin_overview_dashboard.html';
            }
        });
    </script>
</body>
</html>
